<!doctype html>
<html><head><meta charset="utf-8"><title>Banc d'essai des mains</title>
<style>html,body{margin:0;background:#2a1c12;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.js" } }</script>
</head><body>
<script type="module">
// Banc d'essai (outil, pas publié) : affiche les mains dans une petite scène éclairée comme le jeu, pour régler les poses.
import * as THREE from 'three';
import { loadHands, POSES } from '../../mains.js';
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(innerWidth, innerHeight);
R.toneMapping = THREE.ACESFilmicToneMapping; R.outputColorSpace = THREE.SRGBColorSpace; R.shadowMap.enabled = true;
document.body.append(R.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a1c12);
const pm = new THREE.PMREMGenerator(R), room = new THREE.Scene();
room.add(new THREE.Mesh(new THREE.BoxGeometry(10, 10, 10), new THREE.MeshBasicMaterial({ color: 0x2e2118, side: THREE.BackSide })));
const panel = (w, h, c, k, x, y, z) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); room.add(m); };
panel(2.6, 2.6, 0xffd9a8, 5, -2.6, 4, 1.2); panel(4, 2.2, 0xbcd8ff, 2.2, 4.2, 2.2, -3); panel(7, 7, 0xfff1dc, 0.7, 0, 4.9, 0);
scene.environment = pm.fromScene(room, 0.04).texture;
scene.add(new THREE.HemisphereLight(0xfff1dc, 0x3a2a1e, 0.35));
const sun = new THREE.DirectionalLight(0xfff0dd, 1.6); sun.position.set(-0.6, 1.4, 0.8); sun.castShadow = true; scene.add(sun);
const desk = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshStandardMaterial({ color: 0x8a5a32, roughness: 0.55 })); desk.rotation.x = -Math.PI / 2; desk.receiveShadow = true; scene.add(desk);
const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 10);
window.__banc = { THREE, R, scene, cam, POSES, ready: false };
loadHands(THREE, '../../modeles/').then(h => {
  window.__banc.hands = h;
  window.__banc.ready = true;
});
window.__render = () => R.render(scene, cam);
</script>
</body></html>
